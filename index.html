<title>Proyecto camisetas Celta de Vigo</title>

<style>
:root { --bg: #f4f8fb; --surface: #fff; --fg: #0f2433; --muted: #55707f; --line: #d6e3ec; --band: #8ac3ee; --band-fg: #0b2a40; --red: #c8102e; --chip: #e6f1f9; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1820; --surface: #12232e; --fg: #e4eef5; --muted: #8fa9b8; --line: #20394a; --band: #163246; --band-fg: #e4eef5; --red: #ff5a6e; --chip: #1a3242; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; }
header { background: var(--band); color: var(--band-fg); border-bottom: 4px solid var(--red); }
header .wrap { padding-block: 26px; }
h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.3rem); line-height: 1.1; text-wrap: balance; }
header p { margin: 6px 0 0; }
main { padding-block: 6px 28px; }
section { margin-top: 24px; }
h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.art { position: relative; aspect-ratio: 1; background: var(--chip); display: grid; place-items: center; }
.art svg { width: 76%; height: auto; }
.mw { position: absolute; top: 8px; left: 8px; background: var(--red); color: #fff; border-radius: 99px; padding: 2px 8px; font-size: .68rem; font-weight: 700; text-transform: uppercase; }
@media (prefers-color-scheme: dark) { .mw { color: #111; } }
figcaption { padding: 9px 10px 11px; }
figcaption b { display: block; }
figcaption span { display: block; color: var(--muted); font-size: .84rem; overflow-wrap: anywhere; }
footer { padding-block: 0 28px; color: var(--muted); font-size: .8rem; }
</style>
</head>
